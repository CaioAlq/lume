name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      database:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: lume-dev
          POSTGRES_DB: lume
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Dependências da api
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Testes da api
        run: bun run test

      - uses: astral-sh/setup-uv@v6

      - name: Testes do mailer
        working-directory: apps/mailer
        run: uv run pytest
